name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: millhouse.spool
      - uses: actions/checkout@v4
        with:
          repository: codethread/millstrand
          ref: 71c0ed3d80fcad090b74a704a8eb165a3fad996e
          path: skein-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Format
        working-directory: millhouse.spool
        run: make fmt-check
      - name: clj-kondo
        working-directory: millhouse.spool
        run: make lint-clj
      - name: Splint
        working-directory: millhouse.spool
        run: make lint-splint
      - name: Conventions
        working-directory: millhouse.spool
        run: make lint-conventions
      - name: Reflection warnings
        working-directory: millhouse.spool
        run: make reflect-check
      - name: API docs
        working-directory: millhouse.spool
        run: make docs-check

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: workflow
            namespaces: >-
              millhouse.spools.workflow-test
              millhouse.spools.millstrand-workflows-test
          - shard: commands
            namespaces: >-
              millhouse.spools.workflow-run-cli-test
              millhouse.spools.executors.shell-test
              millhouse.executor-discovery-test
              millhouse.spools.identity-test
          - shard: runtime
            namespaces: >-
              millhouse.spools.workflow-cli-test
              millhouse.chime-test
              millhouse.spools.kanban-test
              millhouse.spools.cron.runtime-test
              millhouse.spools.executors.code-test
              millhouse.consumer-test
              millhouse.e2e.cron.lifecycle-test
              millhouse.authoring-forms-test
    steps:
      - uses: actions/checkout@v4
        with:
          path: millhouse.spool
      - uses: actions/checkout@v4
        with:
          repository: codethread/millstrand
          ref: 71c0ed3d80fcad090b74a704a8eb165a3fad996e
          path: skein-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Tests
        working-directory: millhouse.spool
        run: make test TEST_NAMESPACES="${{ matrix.namespaces }}"
        env:
          MILLSTRAND_TEST_AWAIT_SCALE: '3'

  quality:
    if: ${{ always() }}
    needs: [checks, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$TESTS_RESULT" = success
