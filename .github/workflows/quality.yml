name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          clj-kondo: 2026.08.04
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: spools/kanban/scripts/agent-dash/go.mod
          cache-dependency-path: spools/kanban/scripts/agent-dash/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Install package-local plugin tools
        run: |
          pnpm --dir spools/harnesses install --frozen-lockfile
          npm install -g @openai/codex@0.154.0 @earendil-works/pi-coding-agent@0.85.1
      - name: Independent package and composition gates
        run: flock -w 180 /tmp/millstrand-test.lock make quality
        env:
          MILLSTRAND_TEST_AWAIT_SCALE: '3'
      - name: Published Git and native plugin install smoke
        run: flock -w 180 /tmp/millstrand-test.lock scripts/verify-distribution.sh "$REVISION"
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
