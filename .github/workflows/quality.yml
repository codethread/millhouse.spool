name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: millhouse.spool
      - uses: actions/checkout@v4
        with:
          repository: codethread/millstrand
          ref: 9bc90d1c8e421699f72098a8ca59a058be6ff88b
          path: skein-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Format
        working-directory: millhouse.spool
        run: make fmt-check
      - name: clj-kondo
        working-directory: millhouse.spool
        run: make lint-clj
      - name: Splint
        working-directory: millhouse.spool
        run: make lint-splint
      - name: Conventions
        working-directory: millhouse.spool
        run: make lint-conventions
      - name: Reflection warnings
        working-directory: millhouse.spool
        run: make reflect-check
      - name: API docs
        working-directory: millhouse.spool
        run: make docs-check
      - name: Tests
        working-directory: millhouse.spool
        run: make test
        env:
          MILLSTRAND_TEST_AWAIT_SCALE: '3'
