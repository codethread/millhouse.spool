name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - name: Repository static analysis, documentation and Go checks
        run: flock -w 180 /tmp/millstrand-test.lock make fmt-check lint reflect-check docs-check kanban-dash-check

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: workflow
            namespaces: >-
              millhouse.spools.workflow-test
              millhouse.spools.millstrand-workflows-test
          - shard: cli
            namespaces: >-
              millhouse.spools.workflow-cli-test
              millhouse.spools.workflow-run-cli-test
              millhouse.executor-discovery-test
          - shard: executors
            namespaces: >-
              millhouse.spools.executors.shell-test
              millhouse.spools.executors.code-test
              millhouse.spools.identity-test
          - shard: runtime
            namespaces: >-
              millhouse.spools.auto-review-test
              millhouse.spools.auto-run-test
              millhouse.spools.kanban-test
              millhouse.spools.cron.runtime-test
              millhouse.chime-test
              millhouse.consumer-test
              millhouse.e2e.cron.lifecycle-test
              millhouse.authoring-forms-test
              millhouse.package-layout-test
          - shard: land
            namespaces: >-
              millhouse.spools.land.merge-queue-test
              millhouse.spools.land.scripts-test
              millhouse.spools.land.workflow-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - name: Package-local linter configuration
        run: flock -w 180 /tmp/millstrand-test.lock make kondo-import
      - name: Focused test shard
        run: flock -w 180 /tmp/millstrand-test.lock make test TEST_NAMESPACES="$NAMESPACES"
        env:
          NAMESPACES: ${{ matrix.namespaces }}
          MILLSTRAND_TEST_AWAIT_SCALE: '3'

  packages:
    name: Package (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: harnesses-check
            plugins: 'true'
          - target: devflow-check
            plugins: 'false'
          - target: config-check
            plugins: 'false'
          - target: workspace-test
            plugins: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          plugins: ${{ matrix.plugins }}
      - name: Independent package gate
        run: flock -w 180 /tmp/millstrand-test.lock make "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          MILLSTRAND_TEST_AWAIT_SCALE: '3'

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          plugins: 'true'
      - name: Published Git and native plugin install smoke
        run: flock -w 180 /tmp/millstrand-test.lock scripts/verify-distribution.sh "$REVISION"
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

  quality:
    if: ${{ always() }}
    needs: [checks, tests, packages, distribution]
    runs-on: ubuntu-latest
    steps:
      - name: Require every package and integration gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$PACKAGES_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
