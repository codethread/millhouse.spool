name: Millhouse development tools
description: Install the independent package toolchains used by repository checks.
inputs:
  plugins:
    description: Install native plugin tools and the Harnesses locked JS dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest
        clj-kondo: 2026.08.04
    - uses: actions/setup-node@v4
      with:
        node-version: '24.15.0'
    - uses: actions/setup-go@v5
      with:
        go-version-file: spools/kanban/scripts/agent-dash/go.mod
        cache-dependency-path: spools/kanban/scripts/agent-dash/go.sum
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.0
    - uses: astral-sh/setup-uv@v8.2.0
    - name: Linux shell check prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ripgrep jq
    - name: macOS shell check prerequisites
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: brew install flock ripgrep jq
    - name: Native plugin tools
      if: inputs.plugins == 'true'
      shell: bash
      run: |
        pnpm --dir spools/harnesses install --frozen-lockfile
        npm install -g @openai/codex@0.154.0 @earendil-works/pi-coding-agent@0.85.1
