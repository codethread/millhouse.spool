site_name: Millhouse Docs
site_description: Documentation for Millhouse spools
site_url: https://codethread.github.io/millhouse.spool/
docs_dir: .mkdocs
site_dir: site

repo_url: https://github.com/codethread/millhouse.spool
repo_name: codethread/millhouse.spool

# The staged collection projects repository Markdown into MkDocs. This hook
# changes links to repository files outside that collection into source links,
# letting the strict build reserve warnings for broken documentation links.
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  features:
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - md_in_html
  - gfm_admonition

nav:
  - Home: index.md
  - Automatic delivery: docs/auto-run.md
  - Consolidation and handoff: docs/consolidation.md
  - v5 migration: docs/v5.md
  - Shared processes: docs/README.md
  - Spools:
      - Harnesses: spools/harnesses/README.md
      - Native identity plugins: spools/harnesses/plugins/millstrand-identity/README.md
      - Devflow: spools/devflow/README.md
      - Devflow guide: spools/devflow/devflow.md
      - Devflow Kanban adapter: spools/devflow/kanban-adapter/README.md
      - Config: spools/config/README.md
      - Auto-review:
          - Contract: spools/auto-review/README.md
          - API: spools/auto-review/auto-review.api.md
          - Migration: spools/auto-review/migration.md
      - Auto-run:
          - Contract: spools/auto-run/README.md
          - API: spools/auto-run/auto-run.api.md
      - Workflow:
          - Contract: spools/workflow/README.md
          - Cookbook: spools/workflow/workflow.cookbook.md
          - API: spools/workflow/workflow.api.md
      - Chime:
          - Contract: spools/chime/README.md
          - Cookbook: spools/chime/chime.cookbook.md
          - API: spools/chime/chime.api.md
      - Cron:
          - Contract: spools/cron/README.md
          - Cookbook: spools/cron/cron.cookbook.md
          - API: spools/cron/cron.api.md
      - Identity:
          - Contract: spools/identity/README.md
          - Cookbook: spools/identity/identity.cookbook.md
          - API: spools/identity/identity.api.md
      - Code executor:
          - Contract: spools/workflow/README.md
          - Cookbook: spools/workflow/code.cookbook.md
          - API: spools/workflow/code.api.md
      - Shell executor:
          - Contract: spools/workflow/README.md
          - Cookbook: spools/workflow/shell.cookbook.md
          - API: spools/workflow/shell.api.md
      - Land:
          - Contract: spools/land/README.md
          - Cookbook: spools/land/land.cookbook.md
          - API: spools/land/land.api.md
      - Kanban:
          - Contract: spools/kanban/README.md
          - Cookbook: spools/kanban/kanban.cookbook.md
          - API: spools/kanban/kanban.api.md
      - Millstrand-workflows:
          - Contract: spools/workflow/README.md
          - API: spools/workflow/millstrand-workflows.api.md
